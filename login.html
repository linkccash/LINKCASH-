<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LINKCASH - Login</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.wrapper{
    width:100%;
    max-width:420px;
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:20px;

    background:linear-gradient(
        145deg,
        #ffe082,
        #d4a72c,
        #8f6b12
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#050505;
    font-size:24px;
    font-weight:900;
}

.brand h1{
    margin-top:13px;
    font-size:28px;
    letter-spacing:3px;
    color:#ffffff;
}

.brand p{
    margin-top:7px;
    color:#888888;
    font-size:13px;
}

.card{
    background:#101010;
    border:1px solid #292929;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 25px 70px rgba(0,0,0,.65);
}

.title{
    margin-bottom:22px;
}

.title h2{
    font-size:23px;
    color:#ffffff;
    margin-bottom:7px;
}

.title p{
    color:#888888;
    font-size:13px;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    color:#dddddd;
    font-size:13px;
    margin-bottom:8px;
}

input{
    width:100%;
    height:50px;

    background:#070707;
    border:1px solid #292929;
    border-radius:12px;

    color:#ffffff;
    outline:none;

    padding:0 15px;
    font-size:14px;
}

input::placeholder{
    color:#666666;
}

input:focus{
    border-color:#d4a72c;
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:65px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);

    border:none;
    background:none;

    color:#d4a72c;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn{
    width:100%;
    height:52px;

    margin-top:5px;

    border:none;
    border-radius:13px;

    background:linear-gradient(
        135deg,
        #ffe082,
        #d4a72c,
        #a77b17
    );

    color:#080808;
    font-size:15px;
    font-weight:900;

    cursor:pointer;
}

.message{
    display:none;
    margin-top:14px;
    padding:12px;

    border-radius:10px;
    text-align:center;

    font-size:12px;
}

.message.error{
    display:block;
    color:#ff7777;
    background:rgba(220,60,60,.08);
    border:1px solid rgba(220,60,60,.25);
}

.message.success{
    display:block;
    color:#62df91;
    background:rgba(40,180,100,.08);
    border:1px solid rgba(40,180,100,.25);
}

.register{
    text-align:center;

    margin-top:22px;
    padding-top:20px;

    border-top:1px solid #222222;

    color:#888888;
    font-size:13px;
}

.register a{
    color:#e0b83e;
    text-decoration:none;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;

    margin-top:18px;

    color:#666666;
    text-decoration:none;
    font-size:12px;
}

.footer{
    text-align:center;
    margin-top:18px;

    color:#444444;
    font-size:10px;
}
</style></head><body><div class="wrapper"><div class="brand">

    <div class="logo">LC</div>

    <h1>LINKCASH</h1>

    <p>Simple. Secure. Connected.</p>

</div>


<div class="card">

    <div class="title">

        <h2>Welcome Back</h2>

        <p>Login to your LINKCASH account.</p>

    </div>


    <form id="loginForm">

        <div class="field">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
            >

        </div>


        <div class="field">

            <label>Password</label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword"
                >
                    SHOW
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            LOG IN
        </button>

    </form>


    <div id="message" class="message"></div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>


<a href="index.html" class="back">
    ← Back to Home
</a>


<div class="footer">
    © 2026 LINKCASH
</div>

</div><script>

const form = document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const message =
    document.getElementById("message");


/* SHOW PASSWORD */

showPassword.onclick = function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";
        showPassword.textContent = "HIDE";

    }else{

        passwordInput.type = "password";
        showPassword.textContent = "SHOW";

    }

};


/* MESSAGE */

function showMessage(text,type){

    message.className = "message " + type;
    message.textContent = text;
    message.style.display = "block";

}


/* LOGIN */

form.onsubmit = function(event){

    event.preventDefault();

    const username =
        usernameInput.value.trim().toLowerCase();

    const password =
        passwordInput.value;


    if(username === ""){

        showMessage(
            "Please enter your username.",
            "error"
        );

        return;
    }


    if(password === ""){

        showMessage(
            "Please enter your password.",
            "error"
        );

        return;
    }


    /* GET REGISTERED ACCOUNT */

    const saved =
        localStorage.getItem("linkcashAccount");


    if(!saved){

        showMessage(
            "No account found. Please create an account first.",
            "error"
        );

        return;
    }


    let account;


    try{

        account = JSON.parse(saved);

    }catch(error){

        showMessage(
            "Account data is damaged. Please register again.",
            "error"
        );

        return;
    }


    /* CHECK LOGIN */

    if(
        username !==
        String(account.username).toLowerCase()
        ||
        password !==
        String(account.password)
    ){

        showMessage(
            "Username or password is incorrect.",
            "error"
        );

        return;
    }


    /* SAVE LOGIN */

    localStorage.setItem(
        "linkcashLoggedIn",
        "true"
    );


    localStorage.setItem(
        "linkcashUser",
        JSON.stringify(account)
    );


    showMessage(
        "Login successful ✓ Opening dashboard...",
        "success"
    );


    /* GO TO DASHBOARD */

    setTimeout(function(){

        window.location.href =
            "dashboard.html";

    },700);

};

</script></body>
</html>
